{% extends 'base.html' %}

{% block title %}Sign Up - Step 2{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Sign Up - Step 2</h1>
    <p class="text-gray-600 mb-6">Please provide your email for verification</p>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="mb-4">
            <label for="{{ form.email.id_for_label }}" class="block text-gray-700 font-medium mb-2">Email</label>
            {{ form.email }}
            {% if form.email.errors %}
                <p class="text-red-600 text-sm mt-1">{{ form.email.errors.0 }}</p>
            {% endif %}
        </div>
        
        <div class="flex justify-between mt-6">
            <a href="{% url 'signup_step1' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-800 py-2 px-4 rounded-lg font-medium">
                Back
            </a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg font-medium">
                Send OTP
            </button>
        </div>
    </form>
</div>
{% endblock %}
