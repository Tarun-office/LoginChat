{% extends 'base.html' %}

{% block title %}Verify OTP{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Verify OTP</h1>
    
    <p class="text-gray-600 mb-4">We've sent a 6-digit OTP to <span class="font-medium">{{ email }}</span>. Please enter it below to continue.</p>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="mb-4">
            <label for="{{ form.otp.id_for_label }}" class="block text-gray-700 font-medium mb-2">OTP</label>
            {{ form.otp }}
            {% if form.otp.errors %}
                <p class="text-red-600 text-sm mt-1">{{ form.otp.errors.0 }}</p>
            {% endif %}
        </div>
        
        <div class="mt-6">
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg font-medium">
                Verify OTP
            </button>
        </div>
    </form>
</div>
{% endblock %}
